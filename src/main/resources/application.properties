# Carga el archivo .env local (formato KEY=VALUE). Si no existe, usa defaults/variables de entorno.
spring.config.import=optional:file:.env[.properties]
spring.application.name=Tp1
server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/web2}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false